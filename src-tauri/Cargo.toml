[package]
name = "lkr-planner"
version = "0.1.0"
description = "A Tauri App"
authors = ["Florian Richter"]
edition = "2021"

[lib]
name = "lkr_planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
chrono = { version = "0.4", features = ["serde"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
keyring-core = "1"
icalendar = "0.17"
roxmltree = "0.21"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
os_info = { version = "3.15.0", default-features = false }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Each desktop target registers its keyring-core store at startup in secret_manager::init.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"
